<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAN Share</title>
<style>
body{font:16px system-ui;background:#f1f5f9;color:#172033;margin:0;padding:24px}main{max-width:660px;margin:auto}h1{font-size:36px;margin-bottom:0}section{background:white;padding:22px;border-radius:16px;margin-top:20px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #cbd5e1;max-width:100%;box-sizing:border-box}input[type=password]{width:100%;margin:10px 0}button{background:#1458d4;color:white;cursor:pointer}button:disabled{opacity:.5}li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee}li span{overflow-wrap:anywhere;min-width:0}ul{padding:0;list-style:none}progress{width:100%;margin-top:16px}#status{min-height:24px;overflow-wrap:anywhere}small{color:#526176}
</style>
<main><h1>LAN Share</h1><p>Your phone. Your laptop. Same Wi-Fi.</p>
<section><label for="key">Connection key from your laptop</label><input id="key" type="password" autocomplete="off" placeholder="Paste or type connection key"><button id="connect">Connect / refresh</button></section>
<section><h2>Send to laptop</h2><input id="pick" type="file" multiple aria-label="Choose files"><p><button id="upload">Upload files</button></p><small>Up to 100 MiB per file. Existing files are never overwritten.</small><progress id="progress" max="100" value="0" aria-label="Upload progress"></progress></section>
<p id="status" role="status" aria-live="polite">Enter your key to connect.</p>
<section><h2>Files on laptop</h2><small>Place files in the shared folder to download them here.</small><ul id="files"></ul></section></main>
<script>
const $=id=>document.getElementById(id);
const headers=()=>({'X-Share-Key':$('key').value.trim()});
const status=message=>$('status').textContent=message;
async function request(url){const r=await fetch(url,{headers:headers()});if(!r.ok)throw Error((await r.json()).error);return r;}
async function refresh(){const files=await(await request('/api/files')).json();$('files').replaceChildren();for(const file of files){const li=document.createElement('li'),label=document.createElement('span'),button=document.createElement('button');label.textContent=`${file.name} · ${(file.size/1024).toFixed(1)} KiB`;button.textContent='Download';button.onclick=async()=>{button.disabled=true;try{status('Downloading '+file.name+'…');const response=await request('/api/download?name='+encodeURIComponent(file.name));const url=URL.createObjectURL(await response.blob());const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status('Download ready. Check your browser downloads.');}catch(e){status(e.message);}finally{button.disabled=false;}};li.append(label,button);$('files').append(li);}if(!files.length)$('files').textContent='No shared files yet.';}
$('connect').onclick=async()=>{try{await refresh();status('Connected. Ready to share.');}catch(e){status(e.message);}};
function send(file){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/upload?name='+encodeURIComponent(file.name));xhr.setRequestHeader('X-Share-Key',$('key').value.trim());xhr.timeout=300000;xhr.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=e.loaded/e.total*100;};xhr.onload=()=>{if(xhr.status===201)resolve();else{try{reject(Error(JSON.parse(xhr.responseText).error));}catch(e){reject(Error('Upload failed.'));}}};xhr.onerror=()=>reject(Error('Connection lost. Check Wi-Fi and the laptop server.'));xhr.ontimeout=()=>reject(Error('Upload timed out.'));xhr.send(file);});}
$('upload').onclick=async()=>{const files=[...$('pick').files];if(!files.length)return status('Choose a file first.');$('upload').disabled=true;try{for(const file of files){if(file.size>100*1024*1024)throw Error(file.name+' exceeds 100 MiB.');$('progress').value=0;status('Uploading '+file.name+'…');await send(file);}await refresh();$('pick').value='';status('Upload complete. Files are in the laptop shared folder.');}catch(e){status(e.message);}finally{$('upload').disabled=false;}};
</script></html>
