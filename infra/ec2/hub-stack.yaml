AWSTemplateFormatVersion: '2010-09-09'
Description: Single-instance R.I.F.T. hub with CloudFront HTTPS/WSS and Session Manager access.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0dc175c213eb53832
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-058f4672ec467a35f
    Description: Public subnet in the selected project Region; default is the inspected Sydney 2a subnet.
  HubRuntimePolicyArn:
    Type: String
    Description: ARN of the reviewed, least-privilege IAM policy for the hub's DynamoDB, SQS, S3, and IoT calls.
  ArtifactBucket:
    Type: String
    Default: rift-storage-903859732456-ap-southeast-2
  ArtifactKey:
    Type: String
    Description: S3 object key of the source package generated by scripts/package_hub.py.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3a.small]
  CloudFrontOriginPrefixListId:
    Type: String
    Default: pl-b8a742d1
Resources:
  HubSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permit HTTP origin traffic only from CloudFront origin-facing addresses.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: rift-hub-origin

  HubInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Ref HubRuntimePolicyArn
      Tags:
        - Key: Name
          Value: rift-hub-instance-role

  HubInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HubInstanceRole]

  HubInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref HubSecurityGroup]
      IamInstanceProfile: !Ref HubInstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y awscli-2 python3.11 python3.11-pip nginx unzip nano
          id rift >/dev/null 2>&1 || useradd --system --home-dir /opt/rift --shell /sbin/nologin rift
          install -d -o rift -g rift /opt/rift /var/lib/rift
          install -d -m 0750 -o root -g rift /etc/rift-hub/secrets
          aws s3 cp 's3://${ArtifactBucket}/${ArtifactKey}' /tmp/rift-hub.zip --region ${AWS::Region}
          unzip -q /tmp/rift-hub.zip -d /opt/rift
          chown -R rift:rift /opt/rift
          python3.11 -m venv /opt/rift/.venv
          /opt/rift/.venv/bin/pip install --no-cache-dir -r /opt/rift/server/requirements.txt
          curl --fail --silent --show-error https://www.amazontrust.com/repository/AmazonRootCA1.pem -o /etc/ssl/certs/AmazonRootCA1.pem
          chmod 0644 /etc/ssl/certs/AmazonRootCA1.pem
          sed 's|AmazonRootCA1.pem|/etc/ssl/certs/AmazonRootCA1.pem|' /opt/rift/infra/ec2/nginx-rift-hub.conf >/etc/nginx/conf.d/rift-hub.conf
          install -m 0644 /opt/rift/infra/ec2/rift-hub.service /etc/systemd/system/rift-hub.service
          cat >/etc/rift-hub/hub-defaults.env <<'RIFT_DEFAULTS'
          RIFT_ENV=production
          RIFT_AWS_REGION=${AWS::Region}
          RIFT_SERVER_PORT=8765
          RIFT_S3_BUCKET=${ArtifactBucket}
          RIFT_SQS_QUEUE_URL=https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/rift-chunks-queue
          RIFT_IOT_ENDPOINT=a30f3sdnp94spe-ats.iot.${AWS::Region}.amazonaws.com
          RIFT_DEVICE_ID=rift-hub-sydney
          RIFT_HUB_IOT_CLIENT_ID=rift-hub-sydney-listener
          RIFT_HUB_IOT_CERT=/etc/rift-hub/secrets/hub.pem.crt
          RIFT_HUB_IOT_PRIVATE_KEY=/etc/rift-hub/secrets/hub.private.key
          RIFT_HUB_IOT_ROOT_CA=/etc/ssl/certs/AmazonRootCA1.pem
          RIFT_REGISTRY_DB=/var/lib/rift/hub-devices.sqlite3
          RIFT_JOBS_TABLE=rift-jobs
          RIFT_CHUNKS_TABLE=rift-chunks
          RIFT_DEVICES_TABLE=rift-devices
          RIFT_ALLOWED_ORIGINS=
          RIFT_LLM_MODEL=qwen2.5:3b
          RIFT_DEFAULTS
          chmod 0640 /etc/rift-hub/hub-defaults.env
          chown root:rift /etc/rift-hub/hub-defaults.env
          systemctl enable --now nginx
          systemctl daemon-reload
          systemctl enable rift-hub
          # Service has a ConditionPathExists gate until owner-installed secrets and hub certificate exist.
          systemctl start rift-hub || true
          rm -f /tmp/rift-hub.zip

  HubElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref HubInstance

  HubDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: HubElasticIp
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: R.I.F.T. HTTPS/WSS single hub
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - Id: RiftHubOrigin
            DomainName: !GetAtt HubInstance.PublicDnsName
            OriginPath: ''
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: RiftHubOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: !Ref HubNoCachePolicy
          OriginRequestPolicyId: !Ref HubAllViewerPolicy
        PriceClass: PriceClass_All

  HubNoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-no-cache'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  HubAllViewerPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-forward-websocket-and-auth'
        CookiesConfig: { CookieBehavior: all }
        HeadersConfig: { HeaderBehavior: allViewer }
        QueryStringsConfig: { QueryStringBehavior: all }

Outputs:
  HubUrl:
    Description: Stable browser and agent HTTPS/WSS endpoint (CloudFront domain).
    Value: !Sub 'https://${HubDistribution.DomainName}'
  InstanceId:
    Value: !Ref HubInstance
  PublicOriginDns:
    Description: CloudFront origin host. The attached Elastic IP keeps it stable across stop/start.
    Value: !GetAtt HubInstance.PublicDnsName
  ElasticIp:
    Value: !Ref HubElasticIp
  SecurityGroupId:
    Value: !Ref HubSecurityGroup
